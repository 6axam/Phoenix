[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-session"
version = "0.1.0"
description = "Conservative Hyprland session snapshots"
requires-python = ">=3.11"

[project.scripts]
phoenix = "phoenix.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
